spring.application.name=ms-notification
server.port=8089
spring.kafka.bootstrap-servers=172.31.249.51:9092
spring.kafka.consumer.group-id=notification-group

# --- CONFIGURATION DES LOGS ---
logging.level.root=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
INSTANCE_NAME=Instance_A

# ==========================================
# CONFIGURATION BASE DE DONNÉES (POSTGRESQL DOCKER)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/epigreen_notifications
spring.datasource.username=epigreen_admin
spring.datasource.password=epigreen_password
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURATION JPA / HIBERNATE
# ==========================================
# Spring va créer la table 'notifications' tout seul au démarrage !
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true